[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "contextburn"
version = "0.1.0"
description = "How much of what your coding agent spends is actually work: the share of paid tokens that became output, not context re-reading."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Evgenii Arsentev" }]
keywords = ["claude-code", "llm", "coding-agents", "token-usage", "context-window", "observability", "cost-efficiency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://arsentev.ai"
Repository = "https://github.com/arsentev-ai/contextburn"
Research = "https://doi.org/10.5281/zenodo.22699668"
Author = "https://orcid.org/0000-0002-9120-7298"

[tool.setuptools]
# The tool is a single dependency-free script; ship it as a console script file, no package.
packages = []
script-files = ["bin/contextburn"]
