<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Two efficiency numbers, two different owners</title>
  <desc id="desc">The same 12 programming tasks run as one long session versus twelve short sessions, 3 runs each, all tests passing. Token efficiency: long 1.11 percent, short 1.12 percent, no difference. Cost-weighted efficiency: long 31.6 percent, short 24.6 percent, seven points apart. The token share describes the agent; the cost share describes how the operator works.</desc>

  <rect width="1200" height="420" rx="24" fill="#0B0C0E"/>

  <text x="64" y="88" fill="#F2EFE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700">Two numbers, two different owners</text>
  <text x="64" y="128" fill="#8A8F98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Same 12 tasks · one long session vs twelve short · 3 runs each · all tests passing</text>

  <g id="by-tokens" transform="translate(64 166)">
    <rect width="516" height="206" rx="14" fill="#15171B" stroke="#2A2D33" stroke-width="1.5"/>
    <text x="26" y="46" fill="#F2EFE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">By tokens — the agent</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">
      <text x="26" y="96" fill="#C9CCD1">long</text>
      <rect x="112" y="80" width="360" height="20" rx="4" fill="#23262B"/>
      <rect x="112" y="80" width="10" height="20" rx="3" fill="#8A8F98"/>
      <text x="136" y="96" fill="#F2EFE8">1.11%</text>
      <text x="26" y="140" fill="#C9CCD1">short</text>
      <rect x="112" y="124" width="360" height="20" rx="4" fill="#23262B"/>
      <rect x="112" y="124" width="10" height="20" rx="3" fill="#8A8F98"/>
      <text x="136" y="140" fill="#F2EFE8">1.12%</text>
    </g>
    <text x="26" y="184" fill="#8A8F98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">No difference — it is how agents work</text>
  </g>

  <g id="cost-weighted" transform="translate(620 166)">
    <rect width="516" height="206" rx="14" fill="#15171B" stroke="#2A2D33" stroke-width="1.5"/>
    <text x="26" y="46" fill="#F2EFE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Cost-weighted — the operator</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">
      <text x="26" y="96" fill="#C9CCD1">long</text>
      <rect x="112" y="80" width="360" height="20" rx="4" fill="#23262B"/>
      <rect x="112" y="80" width="284" height="20" rx="4" fill="#FF6A1A"/>
      <text x="408" y="96" fill="#F2EFE8">31.6%</text>
      <text x="26" y="140" fill="#C9CCD1">short</text>
      <rect x="112" y="124" width="360" height="20" rx="4" fill="#23262B"/>
      <rect x="112" y="124" width="221" height="20" rx="4" fill="#7A3A17"/>
      <text x="345" y="140" fill="#F2EFE8">24.6%</text>
    </g>
    <text x="26" y="184" fill="#8A8F98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">7 points apart — this part you control</text>
  </g>
</svg>
